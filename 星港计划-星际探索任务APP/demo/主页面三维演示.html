<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>星港计划 · 主页面三维演示</title>
<!--
  【直接双击本文件即可运行，无需联网、无需起服务】

  依赖：同目录的 three.bundle.js（three.js r180 的经典脚本打包，已内置）
  若缺该文件，在本目录执行：node build-classic.mjs

  操作：
    D         性能指标面板（帧率 / 三角面 / 像素化参数）
    P         像素化开关
    1 / 2 / 3 / 4   切换像素块大小（2 / 3 / 4 / 6 px）
    F         全屏
    W         WebGPU 能力探测
    点击分段选择器   切换 计划 / 任务 / 基地
-->
<style>
  :root{
    --bg:#070A10; --surface:#161B23; --line:#232A35; --ink:#E9EDF3; --ink2:#9BA6B4; --ink3:#5E6A78;
    --accent:#E8A468; --ok:#5FBF8F;
  }
  *{box-sizing:border-box;-webkit-text-size-adjust:100%}
  html,body{height:100%}
  body{margin:0;background:radial-gradient(120% 90% at 50% 0%,#101826 0%,#070A10 55%,#04060A 100%);
    color:var(--ink);font:14px/1.5 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    display:flex;align-items:center;justify-content:center;overflow:hidden}

  /* ── 手机框（390×844 设计基准，按窗口等比缩放） ── */
  /* 不用 border：border 会占内容区，390 的画布右侧会被裁掉 2px，
     实测在截图里残留 4 设备像素宽的板外色竖列（#1B222C 一列贯穿到底）。
     改用 inset 阴影画 1px 描边，内容区完整是 390。 */
  #phone{width:390px;height:844px;transform-origin:center center;
    background:var(--bg);border-radius:38px;border:0;overflow:hidden;
    display:flex;flex-direction:column;position:relative;
    box-shadow:0 30px 80px rgba(0,0,0,.6),inset 0 0 0 1px #1B222C}

  /* ══ 无界三维窗口 ══
     三维画布铺满顶部整幅 390×227（47 状态栏 + 180 内容区），
     状态栏、可自定义标题、角落图标全部**浮在画布之上**，不再是画布上方的独立区块。
     这样天空就有足够高度，地平线视角才成立。

        ┌──────────────────────────┐  ← 画布从这里开始（y=0）
        │  9:41            星港    │  ← 状态栏（浮层）
        │  晨昏                     │  ← 标题（浮层）
        │  Lv.12 · 推进值 4,180     │
        │        ～ 地 平 线 ～      │  ← 天空 ~1/3
        │  ▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁▁  │
        │      星球（占下方 2/3）    │
        └──────────────────────────┘  ← y=227
  */
  .top{
    position:absolute;top:0;left:0;right:0;z-index:6;
    padding:8px 16px 0;pointer-events:none;
  }
  .statusbar{height:39px;display:flex;align-items:center;justify-content:space-between;
    color:var(--ink2);font-size:12px;font-variant-numeric:tabular-nums}
  .header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .title{font-size:19px;font-weight:600;letter-spacing:.5px;
    text-shadow:0 1px 6px rgba(0,0,0,.55)}
  .title small{display:block;font-size:11px;font-weight:400;color:var(--ink3);
    letter-spacing:0;text-shadow:0 1px 4px rgba(0,0,0,.55)}

  /* 角落入口（浮在画布右上） */
  .corners{position:absolute;top:59px;right:16px;display:flex;gap:8px;z-index:7}
  .icobtn{width:32px;height:32px;border-radius:50%;border:1px solid rgba(46,55,69,.85);
    background:rgba(16,20,27,.72);display:flex;align-items:center;justify-content:center;
    font-size:13px;color:var(--ink2);backdrop-filter:blur(6px)}

  /* 三维视窗：满幅，无外边距、无圆角 */
  /* 不用 border：border 会让内容区变成 388×225，渲染尺寸与像素格不再整数倍，
     块边会被重采样抹掉（实测过）。用 inset 阴影或 outline 描述边界。 */
  #stage{position:relative;width:390px;height:227px;flex:0 0 auto;
    margin:0;overflow:hidden;background:#050810;
    box-shadow:inset 0 -1px 0 var(--line)}
  #stage canvas{display:block;width:390px;height:227px;image-rendering:pixelated}
  /* 像素化开启时关掉柔光层：它会在画布上叠加板外色，破坏色板纯度 */
  #stage.pixelated .glow{display:none}
  #stage .glow{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(70% 120% at 50% 110%,rgba(232,164,104,.10),transparent 60%)}
  /* 画布底部压一层渐隐，让三维与下方列表衔接不生硬 */
  #stage::after{content:'';position:absolute;left:0;right:0;bottom:0;height:28px;
    pointer-events:none;background:linear-gradient(to bottom,transparent,var(--bg))}
  #stage.pixelated::after{display:none}

  /* 分段选择器（紧接画布下方） */
  .seg{margin:12px auto 0;width:358px;height:36px;display:flex;gap:4px;
    background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px}
  .seg button{flex:1;border:0;border-radius:8px;background:transparent;color:var(--ink2);
    font:inherit;font-size:13px;cursor:pointer;transition:background .16s,color .16s}
  .seg button.on{background:#2A3441;color:var(--ink)}

  /* 内容区（占位列表，示意用） */
  .body{flex:1;padding:14px 16px 0;overflow:hidden}
  .sect{font-size:12px;color:var(--ink3);margin:2px 0 8px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;
    padding:11px 12px;margin-bottom:8px;display:flex;align-items:center;gap:10px}
  .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
  .card .nm{font-size:13px}
  .card .mt{font-size:11px;color:var(--ink3);margin-top:2px}
  .card .rt{margin-left:auto;font-size:11px;color:var(--accent);font-variant-numeric:tabular-nums}
  .emptyhint{color:var(--ink3);font-size:12px;padding:16px 0;text-align:center}

  /* 底部提示 */
  .hint{position:absolute;bottom:10px;left:0;right:0;text-align:center;
    font-size:10px;color:#3A4552;letter-spacing:.5px}

  /* ── 调试面板（D 键） ── */
  #dbg{position:fixed;left:14px;top:14px;z-index:50;display:none;
    background:rgba(10,14,20,.92);border:1px solid var(--line);border-radius:12px;
    padding:12px 14px;font-size:12px;min-width:270px;backdrop-filter:blur(8px)}
  #dbg.on{display:block}
  #dbg h4{margin:0 0 8px;font-size:12px;font-weight:600;color:var(--accent)}
  #dbg .r{display:flex;justify-content:space-between;gap:18px;padding:3px 0;
    border-bottom:1px solid rgba(35,42,53,.7);font-variant-numeric:tabular-nums}
  #dbg .r:last-child{border:0}
  #dbg .r span:first-child{color:var(--ink2)}
  .ok{color:var(--ok)} .bad{color:#C4614E} .warn{color:var(--accent)}
  #dbg .tip{margin-top:8px;font-size:10px;color:var(--ink3);line-height:1.6}
</style>
</head>
<body>

<!-- 调试/实测面板 -->
<div id="dbg">
  <h4>渲染指标（D 关闭）</h4>
  <div class="r"><span>后端</span><span id="d-backend">—</span></div>
  <div class="r"><span>首帧</span><span id="d-first">—</span></div>
  <div class="r"><span>帧时间 p50</span><span id="d-p50">—</span></div>
  <div class="r"><span>帧时间 p95</span><span id="d-p95">—</span></div>
  <div class="r"><span>FPS</span><span id="d-fps">—</span></div>
  <div class="r"><span>掉帧 &gt;33ms</span><span id="d-drop">—</span></div>
  <div class="r"><span>三角面</span><span id="d-tri">—</span></div>
  <div class="r"><span>模式</span><span id="d-view">globe</span></div>
  <div class="r"><span>聚焦对象</span><span id="d-focus">—</span></div>
  <div class="r"><span>像素化</span><span id="d-px">—</span></div>
  <div class="r"><span>DPR / 倍率</span><span id="d-dpr">—</span></div>
  <div class="r"><span>WebGPU</span><span id="d-gpu">—</span></div>
  <div class="r"><span>GPU</span><span id="d-glr" style="font-size:10px;max-width:150px;text-align:right">—</span></div>
  <div class="tip">拖拽旋转 · 双指缩放 · 点建筑聚焦 · Esc 退出<br>F 全屏 · P 像素化 · 1/2/3/4 像素尺寸<br>
    W 试切 WebGPU（切后像素化暂停，见 15 章说明）<br>这些数字可直接放答辩 PPT：帧率与首帧都是实测值。</div>
</div>

<!-- 手机框：三维画布在最底层铺满顶部 390×227，浮层压在上面 -->
<div id="phone">
  <!-- ① 三维画布（最底层，无界） -->
  <div id="stage"><div class="glow"></div></div>

  <!-- ② 浮层：状态栏 + 可自定义标题 -->
  <div class="top">
    <div class="statusbar"><span>9:41</span><span>星港</span></div>
    <div class="header">
      <div class="title" id="title">晨昏<small>Lv.12 · 推进值 4,180</small></div>
    </div>
  </div>

  <!-- ③ 浮层：角落入口 -->
  <div class="corners">
    <div class="icobtn" title="设置">⚙</div>
    <div class="icobtn" title="账户">指</div>
  </div>

  <div class="seg" id="seg">
    <button data-k="plan" class="on">计划</button>
    <button data-k="task">任务</button>
    <button data-k="base">基地</button>
  </div>

  <div class="body" id="body"></div>
  <div class="hint">实时渲染 + 像素化后处理 · 拖动旋转 · 双指缩放 · 点建筑聚焦 · D 看指标</div>
</div>

<!-- three.js 以经典脚本加载（内联打包，暴露 window.THREE）
     为什么不用 ES module：file:// 协议下浏览器会以 CORS 为由拒绝加载任何
     module 脚本（含 <script type="module"> 与 import()），双击打开必失败。
     经典 <script src> 不受此限，所以本页在 file:// / http:// 下都能跑。 -->
<script src="three.bundle.js"></script>

<script>
const $ = id => document.getElementById(id);
const stage = $('stage');

/* ── 自适应缩放：把 390×844 的手机框塞进窗口 ── */
function fit(){
  const s = Math.min(1, (innerHeight - 36) / 844, (innerWidth - 36) / 390);
  $('phone').style.transform = `scale(${s})`;
}
addEventListener('resize', fit); fit();

/* ── 取 three.js（已在 three.bundle.js 里构造好 window.THREE） ── */
const THREE = window.THREE;
if (!THREE) {
  stage.innerHTML = '<div style="color:#C4614E;font-size:12px;padding:16px;line-height:1.7">'
    + 'three.bundle.js 未加载。<br>请确认它与本 HTML 在**同一目录**，且未被杀软/同步盘拦截。<br>'
    + '若刚克隆仓库缺此文件，运行：<code>node build-classic.mjs</code></div>';
  throw new Error('three.bundle.js missing');
}

/* ── 场景 ── */
/* 三维画布满幅 390×227（47 状态栏 + 180 内容区），见 CSS 注释 */
const W = 390, H = 227;
/* 渲染倍率固定 2x（不跟随设备 DPR）
   理由：像素化后有效分辨率只有 390×227 起，倍率再低块边会发虚；
   2x 在 390×227 视口上开销很小（实测 p50 ≈ 8–17ms）。 */
const SCALE = 2;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, W / H, 0.1, 100);

/* ══ 相机与交互 ═══════════════════════════════════════════════════
   三种状态：
     globe     全景待机（默认）—— 星球低速自转，可拖动旋转、双指缩放
     focus     聚焦某座建筑 —— 相机落到该建筑低空，地平线横切、建筑在下三分之一
     transit   两种状态之间的过渡（950ms smootherstep，期间不接受输入）

   focus 取景参数是实测的（逐像素射线求交扫描，非手推公式）：
     dist = 1.10R   back = 0.19R   pitch = +8°
     → 实测天空 35.9%（≈1/3）、建筑恒在屏幕中央 x、y≈68%
     → 建筑屏高约 55px，看得清也点得准
   ════════════════════════════════════════════════════════════════ */
/* focus 取景参数：先解析扫描定位，再用实际渲染帧逐档实测校正。
   （解析式按半径 1 的球求交，但实际还有一层 1.035R 大气壳会遮住地平线
    上方一条天空，所以解析值偏乐观——必须按实测调。）
   实测（780×454 截图统计最暗色占比 = 天空面积）：
     dist 1.05 → 天空 41.0%   dist 1.10 → 35.9%   dist 1.15 → 28.4%
     dist 1.20 → 22.3%        dist 1.30 → 14.7%
   取 1.10：天空 35.9%（≈1/3），建筑屏底 y≈68%，屏高约 55px、可点面积约 1900 像素。 */
const FAC = { dist: 1.10, back: 0.19, pitch: 8 * Math.PI / 180 };
const GLOBE = {
  // 390×227 视口 aspect=1.72，球投影受"高度"约束：
  //   d=3.0 → 占高 112%（上下裁）  d=3.6 → 占高 92%（完整，接近满高）  d=4.2 → 78%
  // 默认取 3.6：完整可见且够大，留一点余量给待机自转时的视觉呼吸
  dist: 3.60, distMin: 2.80, distMax: 5.60,
  el: 18 * Math.PI / 180, elMin: 4 * Math.PI / 180, elMax: 58 * Math.PI / 180,
};
const FOC_DIST_MIN = 1.03, FOC_DIST_MAX = 1.80;
/* 聚焦轨道约束：
   FOC_POL_MIN 极角下限——再往上相机与 up（=径向）接近共线，lookAt 会退化
   FOC_R_MIN   相机到球心的最小半径——低于它相机会钻进 1.035R 大气壳 */
const FOC_POL_MIN = 22 * Math.PI / 180;
const FOC_R_MIN = 1.05;
/* 轨道枢轴 / 看点半径取 1.0（球面），不是设施网格的 1.006。
   原因：原 home 机位的 lookAt 就是单位法线方向（半径 1.0），
   换成 1.006 会让"相机→看点"的仰角从 21.45° 变 19.99°，
   叠上 +8° pitch 后建筑屏位从 68.2% 掉到 72.3% —— 实测已验证会漂 4%。
   设施盒体实际跨半径 0.986–1.026，1.0 就在盒体内部，取枢轴并无问题。 */
const FOC_PIVOT_R = 1.0;
const IDLE_DELAY = 2000;      // 停止操作多久恢复自转（ms）
const IDLE_SPIN  = 0.055;     // 待机自转 rad/s（比原来慢一个量级）
const TRANSIT_MS = 950;

const S = {
  mode: 'globe',              // globe | focus | transit
  focusIdx: -1,
  spin: 0,                    // 星球自转角（唯一真相）
  spinVel: 0,                 // 拖动惯性
  dist: GLOBE.dist,
  el: GLOBE.el,
  // 聚焦轨道：绕建筑旋转的两个角（相对 home 机位的增量）
  fAz: 0,                     // 方位角增量（绕法线转）
  fPol: 0,                    // 极角增量（改变俯视程度）
  th0: 0, ph0: 0,             // home 机位在建筑局部基下的分解结果（每帧算）
  lastInput: performance.now(),
  // 过渡
  t0: 0, dur: TRANSIT_MS, from: null, to: null, next: 'globe',
};

/* 相机目标（每帧计算后 lerp 到这里） */
const WORLD_UP = new THREE.Vector3(0, 1, 0);
const camUp = new THREE.Vector3(0, 1, 0);
const camPos = new THREE.Vector3(0, 1.0, 3.2);
const camLook = new THREE.Vector3(0, 0, 0);

const _n = new THREE.Vector3();      // 建筑世界法线
const _tp = new THREE.Vector3();     // 相机目标位置
const _tl = new THREE.Vector3();     // 相机目标看点

const _v1 = new THREE.Vector3(), _v2 = new THREE.Vector3(), _v3 = new THREE.Vector3();
const _v4 = new THREE.Vector3(), _v5 = new THREE.Vector3();

/* 全局机位：球面轨道 */
function globeTargets() {
  const d = S.dist, el = S.el;
  _tp.set(0, Math.sin(el) * d, Math.cos(el) * d);
  _tl.set(0, 0, 0);
}

/* ── 聚焦机位：以建筑为球心的第二层轨道相机 ──────────────────────
   相机不再钉在一条固定射线上，而是绕建筑旋转。做法：

   ① 在建筑处建局部正交基
        n  = 该点法线（也是球的径向）
        tN = 朝北切向          tE = n × tN（朝东）
   ② 先按实测验证过的 home 机位算出相对建筑的偏移
        home = normalize(n − back·tN) · FAC.dist
        off  = home − P            （P = n · FOC_PIVOT_R，枢轴）
   ③ 把 off 在局部基下分解成球坐标 (r, θ₀, φ₀)：
        r  = |off|
        θ₀ = 与 n 的夹角          φ₀ = 绕 n 的方位
   ④ 叠加用户拖动量 (fPol, fAz)，夹住极角，再还原成方向
   ⑤ 缩放走 S.dist（沿用既有范围），即 r' = r · S.dist / FAC.dist

   关键性质：fAz = fPol = 0 时数学上等价于原 home 机位，
   所以之前实测校正过的取景（天空 35.9%、建筑 y=68%）原样保留。
   ──────────────────────────────────────────────────────────────── */
function focusTargets(nw) {
  // ① 建筑局部正交基
  const lat = Math.asin(Math.max(-1, Math.min(1, nw.y)));
  const lon = Math.atan2(nw.x, nw.z);
  _v1.set(-Math.sin(lat) * Math.sin(lon), Math.cos(lat), -Math.sin(lat) * Math.cos(lon)); // tN
  if (_v1.lengthSq() < 1e-8) _v1.set(0, 0, -1);
  _v1.normalize();
  _v4.crossVectors(nw, _v1).normalize();                       // tE

  // ② home 机位 → 相对建筑的偏移
  _v5.copy(nw).multiplyScalar(FOC_PIVOT_R);                    // P：枢轴（球面点）
  _v2.copy(nw).addScaledVector(_v1, -FAC.back).normalize().multiplyScalar(FAC.dist);
  _v2.sub(_v5);                                                // off = home − P

  // ③ 分解成 (r, θ₀, φ₀)
  const r0 = _v2.length();
  S.th0 = Math.acos(Math.max(-1, Math.min(1, _v2.dot(nw) / r0)));
  S.ph0 = Math.atan2(_v2.dot(_v4), _v2.dot(_v1));

  // ④ 叠加轨道量 + 夹极角
  const r = r0 * (S.dist / FAC.dist);
  // 相机不钻大气壳：|P + dir·r|² ≥ FOC_R_MIN²
  const cosLim = (FOC_R_MIN * FOC_R_MIN - FOC_PIVOT_R * FOC_PIVOT_R - r * r) / (2 * FOC_PIVOT_R * r);
  const thMax = Math.max(FOC_POL_MIN, Math.acos(Math.max(-1, Math.min(1, cosLim))));
  const th = Math.max(FOC_POL_MIN, Math.min(thMax, S.th0 + S.fPol));
  S.fPol = th - S.th0;                       // 反算回去，避免"拖过头"累积
  const ph = S.ph0 + S.fAz;
  const st = Math.sin(th), ct = Math.cos(th);

  // ⑤ pos = P + r·( n·cosθ + (tN·cosφ + tE·sinφ)·sinθ )
  _tp.copy(_v5)
     .addScaledVector(nw, r * ct)
     .addScaledVector(_v1, r * st * Math.cos(ph))
     .addScaledVector(_v4, r * st * Math.sin(ph));

  // ⑥ 看向建筑，再绕 right 抬 pitch（把建筑压到画面下三分之一）
  _tl.copy(_v5);
  _v3.copy(_tl).sub(_tp).normalize();
  _v2.crossVectors(_v3, nw);
  if (_v2.lengthSq() < 1e-8) _v2.set(1, 0, 0);
  _v2.normalize();
  _v3.applyAxisAngle(_v2, FAC.pitch);
  _tl.copy(_tp).add(_v3);
}


/* 取某座建筑的当前世界法线（随星球自转变化） */
function worldNormalOf(idx) {
  const m = facs[idx];
  if (!m) return null;
  _n.copy(m.position).normalize().applyQuaternion(planet.quaternion);
  return _n;
}

/* 切换模式（带过渡） */
function goGlobe() {
  if (S.mode === 'globe') return;
  S.from = { pos: camPos.clone(), look: camLook.clone() };
  S.mode = 'transit'; S.next = 'globe'; S.focusIdx = -1;
  globeTargets();
  S.to = { pos: _tp.clone(), look: _tl.clone() };
  STAT.t0 = performance.now(); S.dur = TRANSIT_MS;
  S.dist = GLOBE.dist;
  if ($('d-view')) $('d-view').textContent = 'globe';
  if ($('d-focus')) $('d-focus').textContent = '—';
}

function goFocus(idx) {
  const nw = worldNormalOf(idx);
  if (!nw) return;
  S.from = { pos: camPos.clone(), look: camLook.clone() };
  S.mode = 'transit'; S.next = 'focus'; S.focusIdx = idx;
  S.fAz = 0; S.fPol = 0;                     // 每次聚焦都回到 home 机位
  focusTargets(nw.clone());
  S.to = { pos: _tp.clone(), look: _tl.clone() };
  STAT.t0 = performance.now(); S.dur = TRANSIT_MS;
  S.dist = FAC.dist;
  if ($('d-view')) $('d-view').textContent = 'focus';
  if ($('d-focus')) $('d-focus').textContent = '#' + (idx + 1);
}

/* ── 缓动与跟手系数 ──────────────────────────────────────────────
   过渡用 quintic smootherstep：t³(t(6t−15)+10)
     它的首尾不但一阶导为 0，二阶导也是 0 → 起步和收尾都没有"顿一下"的感觉。
     原来用的 cubic ease-in-out 首尾一阶导为 0 但二阶导突变，
     观感上是"猛地起步 → 匀速 → 猛地刹住"，也就是反馈里说的"速度变化太快"。
     峰值速度（相对平均速度）：cubic ease-in-out = 3.00×，smootherstep = 1.875×。
     峰值出现在 t=0.5，f'(0.5) 由 +12 突变为 −12（jerk 尖峰）也是"猛"的来源之一；
     smootherstep 的 f'(0)=f'(1)=0 且全程连续。
   跟手插值按 dt 归一（原来写死 0.35/帧，帧率一低就跟不上）：
     1 − e^(−rate·dt)，rate=26 在 60fps 下 ≈ 0.35
   ──────────────────────────────────────────────────────────────── */
const _ease = t => t * t * t * (t * (t * 6 - 15) + 10);
const _followK = (rate, dtSec) => 1 - Math.exp(-rate * dtSec);
function updateCamera(now, dtSec = 1 / 60) {
  let k;
  if (S.mode === 'transit') {
    const t = Math.min(1, (now - STAT.t0) / S.dur);
    const e = _ease(t);
    camPos.lerpVectors(S.from.pos, S.to.pos, e);
    camLook.lerpVectors(S.from.look, S.to.look, e);
    if (t >= 1) { S.mode = S.next; }
    k = 0.35;
  } else if (S.mode === 'focus') {
    const nw = worldNormalOf(S.focusIdx);
    if (nw) focusTargets(nw.clone());
    k = _followK(26, dtSec);
    camPos.lerp(_tp, k);
    camLook.lerp(_tl, k);
  } else {
    globeTargets();
    k = _followK(22, dtSec);
    camPos.lerp(_tp, k);
    camLook.lerp(_tl, k);
  }
  camera.position.copy(camPos);
  /* up 向量必须按模式给：
     globe  → 世界 +Y（常规轨道相机）
     focus  → 该建筑的径向法线。用世界 +Y 当地平线会斜：
              建筑在 lat 44–64 时径向与 +Y 差 26–46°，
              截图实测地平线明显歪斜（左下高、右上低）。
              换成径向后地平线才是水平的。 */
  if (S.mode === 'focus') {
    const nw = worldNormalOf(S.focusIdx);
    if (nw) camUp.lerp(nw, k);
  } else if (S.mode === 'transit') {
    camUp.lerp(S.next === 'focus' ? worldNormalOf(S.focusIdx) ?? WORLD_UP : WORLD_UP, k * 0.6);
  } else {
    camUp.lerp(WORLD_UP, _followK(20, dtSec));
  }
  camUp.normalize();
  camera.up.copy(camUp);
  camera.lookAt(camLook);
  camera.near = S.mode === 'focus' || S.mode === 'transit' ? 0.01 : 0.05;
  camera.updateProjectionMatrix();
}
globeTargets();
camPos.copy(_tp); camLook.copy(_tl);


/* 程序化星球贴图：低饱和海陆 + 极冠（不用外部资源，离线也能跑） */
function makePlanetTexture(){
  const c = document.createElement('canvas');
  c.width = 1024; c.height = 512;
  const g = c.getContext('2d');
  g.fillStyle = '#1D3352'; g.fillRect(0, 0, 1024, 512);                 // 海
  // 陆块：随机圆叠加
  for (let i = 0; i < 90; i++) {
    const x = Math.random() * 1024;
    const y = 60 + Math.random() * 392;
    const r = 18 + Math.random() * 70;
    const t = Math.random();
    g.beginPath();
    g.fillStyle = t > .6 ? '#3A5A4E' : t > .3 ? '#4A5F46' : '#5A6B4C';
    g.ellipse(x, y, r, r * (0.5 + Math.random() * 0.6), Math.random() * 3, 0, 7);
    g.fill();
  }
  // 极冠
  g.fillStyle = 'rgba(210,224,236,.55)';
  g.fillRect(0, 0, 1024, 26); g.fillRect(0, 486, 1024, 26);
  // 轻微噪点，避免大面积纯色
  for (let i = 0; i < 9000; i++) {
    g.fillStyle = `rgba(255,255,255,${Math.random() * .04})`;
    g.fillRect(Math.random() * 1024, Math.random() * 512, 1, 1);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

/* 星球（64×32 = 4,096 面，按评估文档） */
const planet = new THREE.Mesh(

/* 设施：8 座小建筑，贴在球面上。
   位置按「地平线视角可见区」排布，经屏幕投影验证：
     lat 44–64°、lon ±36°，全部落在地平线下方（距地平线 31–56px），
     且横向均匀铺开（屏 x：44 / 78 / 118 / 158 / 200 / 240 / 280 / 314）。
   在全景视角下它们聚在球面上半部，也仍可见。 */
const FACILITY_SPOTS = [
  [44, -36], [52, -36], [64, -36],
  [60,  -9], [60,   9],
  [64,  36], [52,  36], [44,  36],
];
const facGeo = new THREE.BoxGeometry(.028, .040, .028);
const facs = [];
for (let i = 0; i < FACILITY_SPOTS.length; i++) {
  const [latd, lond] = FACILITY_SPOTS[i];
  const lat = latd * Math.PI / 180, lon = lond * Math.PI / 180;
  // 地平线视角是俯视地表，建筑要"立"在球面上 → 用该点法线做朝向
  const n = new THREE.Vector3(
    Math.cos(lat) * Math.sin(lon), Math.sin(lat), Math.cos(lat) * Math.cos(lon)
  );

    color: i % 3 === 1 ? 0x5FBF8F : 0xE8A468,

  facs.push(m); planet.add(m);
}

/* ── 渲染器 ── */
let renderer, backend = 'WebGL2';

/* ══════════════════════════════════════════════════════════════════
   像素化后处理（pixelate + 色板量化 + Bayer 抖动）
   目的：让三维视窗与项目像素风格统一。

   颜色全部取自 07 §4.2 相位色板 + §4.3 accent，不是另配的一套色：
     ?  详见 docs「13-像素组件库规范」的令牌表与 07 §4.2。
   ══════════════════════════════════════════════════════════════════ */

/* 16 色板：深空 → 相位中间调 → 高光/强调。
   顺序无关（用最近色匹配），但按明度递增排列便于人工核对。 */
const PALETTE_SRGB = [
  0x03050A, // 深夜天空（07 §4.2 deep 天空）
  0x0A1020, // 深夜 / 配图背景
  0x101A2C, // 夜
  0x151C2E, // 晨 天空
  0x1D3352, // 星球海（demo 贴图底色）
  0x24344E, // 深夜 高光
  0x2A3550, // 晨 星球主色 / 环境光
  0x3A2F44, // 昏 星球主色
  0x3A5A80, // 夜 高光（配图中间调锚点）
  0x4A6FA5, // 昼 星球主色
  0x5A9BD4, // 夜 强调 / accent-confirm 蓝
  0x5FBF8F, // §4.3 accent/green（设施已达成）
  0x7FA3C9, // 昼 天空
  0xC98A5A, // 晨 高光
  0xE8A468, // §4.3 accent/amber（强调色，配额 ≤8%）
  0xF2E4C9, // 昼 高光（奶油）
];
const PAL_N = PALETTE_SRGB.length;
// GLSL 里按 sRGB 空间比较，所以色板直接用 sRGB 值
const paletteVec3 = PALETTE_SRGB.map(h => new THREE.Vector3(
  ((h >> 16) & 255) / 255,
  ((h >> 8) & 255) / 255,
  (h & 255) / 255
));

/* 虚拟分辨率档位：大像素边长（设备像素）。0 = 关闭。
   358×180 视口、渲染倍率 2x → 画布 716×360。
   ×2 → 358×180 格（等于 1 CSS px / 格，最细）
   ×3 → 238×120 格
   ×4 → 179×90 格
   ×6 → 119×60 格
   默认 ×2：块只有 1 CSS px，看起来是"细腻的像素感"而不是马赛克。 */
const PX_LEVELS = [0, 2, 3, 4, 6];
let pxSize = 2;
let pixelOn = true;

/* 全屏后处理：无需 EffectComposer，自己搭一个正交相机 + 全屏四边形 */
const postScene = new THREE.Scene();
const postCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const postMat = new THREE.ShaderMaterial({
  defines: { PAL: PAL_N },
  uniforms: {
    tDiffuse: { value: null },
    uGrid:    { value: new THREE.Vector2(390, 227) },
    uPalette: { value: paletteVec3 },
    uDither:  { value: 0.06 },   // sRGB 空间的抖动幅度
  },
  vertexShader: /* glsl */`
    varying vec2 vUv;
    void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }
  `,
  fragmentShader: /* glsl */`
    precision highp float;
    uniform sampler2D tDiffuse;
    uniform vec2  uGrid;
    uniform vec3  uPalette[PAL];
    uniform float uDither;
    varying vec2 vUv;

    // 有序抖动矩阵（Bayer 4×4），用算术式避免 GLSL1 的动态数组索引限制
    float bayer2(vec2 a){ a = floor(a); return fract(a.x / 2.0 + a.y * a.y * 0.75); }
    float bayer4(vec2 a){ return bayer2(0.5 * a) * 0.25 + bayer2(a); }

    // sRGB ↔ linear：场景在 linear 空间渲染，量化必须在 sRGB 空间做，
    // 否则暗部会被线性空间压扁、配色与 2D 稿对不上
    vec3 lin2srgb(vec3 c){
      return mix(c * 12.92, 1.055 * pow(max(c, vec3(0.0)), vec3(1.0/2.4)) - 0.055,
                 step(vec3(0.0031308), c));
    }
    vec3 srgb2lin(vec3 c){
      return mix(c / 12.92, pow((c + 0.055) / 1.055, vec3(2.4)),
                 step(vec3(0.04045), c));
    }

    void main(){
      // ① 按虚拟像素格取样：格心坐标 + 最近邻 → 硬像素边，无插值
      vec2 cell = floor(vUv * uGrid);
      vec2 uv   = (cell + 0.5) / uGrid;
      vec3 lin  = texture2D(tDiffuse, uv).rgb;

      // ② 转到 sRGB 空间做抖动 + 量化
      //    抖动坐标用 cell 而非 gl_FragCoord：抖动点尺寸 = 一个大像素，
      //    否则抖动会在放大后的块内碎裂，失去像素风
      vec3 c = lin2srgb(lin);
      c += (bayer4(cell) - 0.5) * uDither;
      c = clamp(c, 0.0, 1.0);

      // ③ 最近色匹配（加权 RGB，近似感知亮度）
      float best = 1e9;
      vec3  pick = uPalette[0];
      for (int i = 0; i < PAL; i++){
        vec3 df = c - uPalette[i];
        float dist = dot(df * df, vec3(0.30, 0.59, 0.11));
        if (dist < best){ best = dist; pick = uPalette[i]; }
      }

      // ④ 直接输出 sRGB 值
      //    关键：ShaderMaterial **不会**被 three 自动套上 outputColorSpace 转换
      //    （只有内置材质会）。所以这里必须写成"已编码的 sRGB"，不能再 srgb2lin，
      //    否则会被压暗一次 —— 实测会得到 #0B1A37 这类板外色。
      gl_FragColor = vec4(pick, 1.0);
    }
  `,
  depthTest: false, depthWrite: false,
});
postScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), postMat));

/* 低分辨率 RenderTarget：最近邻放大是"硬像素"的关键 */
const rt = new THREE.WebGLRenderTarget(390, 227, {
  minFilter: THREE.NearestFilter,
  magFilter: THREE.NearestFilter,
  depthBuffer: true,
});

let vGridW = 390, vGridH = 227;
const _db = new THREE.Vector2();

function layoutPixels(){
  renderer.getDrawingBufferSize(_db);
  const px = pixelOn ? pxSize : 1;
  vGridW = Math.max(16, Math.floor(_db.x / px));
  vGridH = Math.max(9,  Math.floor(_db.y / px));
  rt.setSize(vGridW, vGridH);
  postMat.uniforms.uGrid.value.set(vGridW, vGridH);
  updatePxLabel(_db.x, _db.y);
}

function updatePxLabel(dw, dh){
  if (backend !== 'WebGL2') {
    // WebGPU 分支不做后处理：ShaderMaterial 的后处理需改用 TSL 节点，
    // 课设范围内不做（见 15 章：WebGPU 只作可选加速，不进验收）
    $('d-px').textContent = 'WebGPU 路径未启用';
    $('d-px').className = 'warn';
  } else if (!pixelOn) {
    $('d-px').textContent = '关（原生分辨率）';
    $('d-px').className = '';
  } else {
    const scale = dw ? (dw / vGridW) : pxSize;
    $('d-px').textContent = `${vGridW}×${vGridH} 格 · 放大 ×${scale.toFixed(2)} · ${PAL_N} 色`;
    $('d-px').className = 'ok';
  }
}

function setPixel(on, size){
  pixelOn = on;
  if (size) pxSize = size;
  // 像素化时关掉柔光叠层，保证画布上的颜色只来自色板量化结果
  stage.classList.toggle('pixelated', on && backend === 'WebGL2');
  layoutPixels();
}

layoutPixels();
stage.classList.add('pixelated');   // 初始即开启像素化 → 关掉柔光层

/* 调试接口：暴露到 window，便于控制台/自动化调参与验证
   （E2E 截图脚本靠它切开关，否则 module 作用域外访问不到） */
window.__px = {
  setPixel, get pixelOn(){ return pixelOn; },
  get pxSize(){ return pxSize; },
  get grid(){ return [vGridW, vGridH]; },
  palette: PALETTE_SRGB.map(h => '#' + h.toString(16).toUpperCase().padStart(6,'0')),
};

/* ── 统计 ── */
const STAT = { n: 0, t0: performance.now(), first: 0, times: [], drop: 0, win: performance.now() };
/* 注意：renderer.info.render 在**每次** render 调用后重置，
   像素化模式下最后一次 render 是全屏 quad（2 面），会把场景真实面数覆盖掉。
   所以在场景渲染后立即取值，不能等到 refresh() 里再读。 */
let sceneTris = 0;
const triCount = () => sceneTris;

let cap30 = false, last = 0;
function tick(ts) {
  requestAnimationFrame(tick);
  if (cap30 && ts - last < 33.3) return;
  last = ts;

  const now = performance.now();
  const dt = now - (STAT.prev || now); STAT.prev = now;

  if (STAT.n === 0) { STAT.first = now - STAT.t0; $('d-first').textContent = STAT.first.toFixed(0) + ' ms'; }

  // 星球自转：只有 globe 待机且无输入时才转
  /* 自转与惯性一律按实际 dt 积分，不能每帧加固定量：
     软件渲染下只有 40–50fps，每帧固定 1/60 会让实际转速比设定值低 20–30%
     （实测 IDLE_SPIN=0.055 跑出 0.041 rad/s）。
     step = 本帧时长 / (1/60)，把"每 60fps 帧的量"换算成"本帧该给的量"。 */
  const dtSec = Math.min(0.05, dt / 1000);   // 上限 50ms：切后台回来时防止大跳
  const idle = now - S.lastInput > IDLE_DELAY;
  if (S.mode === 'globe') {
    if (!S.dragging) {
      const step = dtSec * 60;
      S.spin += S.spinVel * step;
      S.spinVel *= Math.pow(0.92, step);         // 惯性衰减（按帧率归一）
      if (Math.abs(S.spinVel) < 0.0005) S.spinVel = 0;
      if (idle && Math.abs(S.spinVel) < 0.01) S.spin += IDLE_SPIN * dtSec;
    }
    planet.rotation.y = S.spin;
  }
  updateCamera(now, dtSec);

  /* 建筑距离补偿缩放（LOD）
     透视下建筑尺寸 ∝ 1/相机距离：
       focus（距球心 1.4R，离建筑约 0.4R）→ 屏高约 30px
       globe（距球心 3.6R，离建筑约 2.6R）→ 同尺寸只剩约 4.6px，看不清也难点
     按距离反向放大，让建筑在两档都维持 10–30px 的可辨、可点尺寸。
     物理上不严格，但交互上必要。 */
  const lvScale = Math.max(1, Math.min(3.2, (S.dist - 0.95) / 1.4));
  for (let i = 0; i < facs.length; i++) facs[i].scale.setScalar(lvScale);
  // 太阳缓慢横移，地平线视野内的明暗渐变会随之变化
  const sx = -2.2 + 1.1 * Math.sin(now * .00005);
  sun.position.set(sx, 1.6, 1.2);

  if (pixelOn && backend === 'WebGL2') {
    // ① 场景渲染到低分辨率 RT（无 MSAA → 硬边）
    renderer.setRenderTarget(rt);
    renderer.render(scene, camera);
    sceneTris = renderer.info.render.triangles;   // 立即取值（下次 render 会重置）
    // ② 全屏后处理：最近邻放大 + 抖动 + 色板量化
    renderer.setRenderTarget(null);
    postMat.uniforms.tDiffuse.value = rt.texture;
    renderer.render(postScene, postCam);
  } else {
    renderer.render(scene, camera);
    sceneTris = renderer.info.render.triangles;
  }

  STAT.n++;
  if (dt > 0 && dt < 500) { STAT.times.push(dt); if (STAT.times.length > 3000) STAT.times.shift(); }
  if (dt > 33) STAT.drop++;

  if (now - STAT.win > 500) { STAT.win = now; refresh(now); }
}

function refresh() {
  const a = STAT.times.slice().sort((x, y) => x - y);
  if (!a.length) return;
  const p = q => a[Math.min(a.length - 1, Math.floor(a.length * q))];
  const p50 = p(.5), p95 = p(.95);
  $('d-p50').textContent = p50.toFixed(2) + ' ms';
  $('d-p95').textContent = p95.toFixed(2) + ' ms';
  $('d-p95').className = p95 <= 16.8 ? 'ok' : p95 <= 33.4 ? 'warn' : 'bad';
  $('d-fps').textContent = (1000 / Math.max(p50, .01)).toFixed(0);
  $('d-drop').textContent = STAT.drop;
  $('d-tri').textContent = triCount().toLocaleString();
  $('d-backend').textContent = backend;
}

/* 设备信息 */
$('d-dpr').textContent = `${devicePixelRatio} / ×${SCALE}`;
$('d-gpu').textContent = navigator.gpu ? 'API 存在' : '无';
if (navigator.gpu) $('d-gpu').className = 'warn';
{

/* ── 交互 ── */
addEventListener('keydown', e => {

  // 视角：Esc / V 退出聚焦回到全景

  // 像素化：P 开关，1/2/3/4 切档（大像素边长，设备像素）
  if (k === 'p') { setPixel(!pixelOn); }
  if ('1234'.includes(k)) { setPixel(true, PX_LEVELS[+k]); }
});
addEventListener('resize', () => { layoutPixels(); });

/* 分段选择器 + 占位内容（示意，非真实数据） */

/* WebGPU 探测（不切换后端）
   本页是经典脚本版（为让 file:// 双击可用），而 WebGPURenderer 只在
   three/webgpu 子包里、只能走 ES module 动态 import，故此处只做能力探测。
   要真跑 WebGPU：见 15 章评估，或改用 module 版页面。 */
async function tryWebGPU() {
  const hasApi = !!navigator.gpu;
  let adapterOk = false;
  if (hasApi) {
    try { adapterOk = !!(await navigator.gpu.requestAdapter()); } catch { adapterOk = false; }
  }
  alert(
    'WebGPU 探测结果：\n\n' +
    '  navigator.gpu: ' + (hasApi ? '存在' : '不存在') + '\n' +
    '  适配器可用: ' + (hasApi ? (adapterOk ? '是' : '否（API 有但驱动不支持 → 需降级）') : '—') + '\n\n' +
    '本页为经典脚本版，渲染后端固定 WebGL2，像素化正常工作。'
  );
}

/* ══ 交互：拖动旋转 / 双指缩放 / 点建筑聚焦 ═══════════════════════
   globe：单指拖动=旋转（带惯性）、双指=缩放、点建筑=聚焦
   focus：单指拖动=以建筑为中心环绕、双指=缩放、点天空或 Esc=退回
   ═══════════════════════════════════════════════════════════════ */
const raycaster = new THREE.Raycaster();
const pointerNDC = new THREE.Vector2();
const el = renderer.domElement;

const T = {
  pointers: new Map(),
  pinchStartDist: 0,
  pinchStartScale: 0,
  lastX: 0, lastY: 0,
  downOn: -1,
  downPos: { x: 0, y: 0 },
  moved: false,          // 本次按下后是否拖动过（用于区分「点击」与「拖动」）
};

function hitFacilities(clientX, clientY) {
  const r = el.getBoundingClientRect();
  pointerNDC.x = ((clientX - r.left) / r.width) * 2 - 1;
  pointerNDC.y = -((clientY - r.top) / r.height) * 2 + 1;
  raycaster.setFromCamera(pointerNDC, camera);
  const hits = raycaster.intersectObjects(facs, false);
  if (hits.length) return facs.indexOf(hits[0].object);
  // 屏幕空间兜底：建筑在远景下很小，命中区放宽到 20px
  let best = -1, bestD = 400;
  const v = new THREE.Vector3();
  for (let i = 0; i < facs.length; i++) {
    v.copy(facs[i].position); planet.localToWorld(v);
    const p = v.clone().project(camera);
    if (p.z > 1) continue;
    const sx = (p.x * .5 + .5) * r.width + r.left;
    const sy = (-p.y * .5 + .5) * r.height + r.top;
    const d = (sx - clientX) ** 2 + (sy - clientY) ** 2;
    if (d < bestD) { bestD = d; best = i; }
  }
  return best;
}

const ptrList = () => [...T.pointers.values()];

el.addEventListener('pointerdown', e => {
  el.setPointerCapture?.(e.pointerId);
  T.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  S.lastInput = performance.now();

  if (T.pointers.size === 1) {
    S.dragging = true;
    S.spinVel = 0;
    T.lastX = e.clientX; T.lastY = e.clientY;
    T.downPos = { x: e.clientX, y: e.clientY };
    T.moved = false;
    T.downOn = S.mode === 'globe' ? hitFacilities(e.clientX, e.clientY) : -1;
  } else if (T.pointers.size === 2) {
    const [a, b] = ptrList();
    T.pinchStartDist = Math.hypot(a.x - b.x, a.y - b.y) || 1;
    T.pinchStartScale = S.dist;
    S.dragging = false;
    T.downOn = -1;
  }
});

el.addEventListener('pointermove', e => {
  if (!T.pointers.has(e.pointerId)) return;
  T.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  S.lastInput = performance.now();

  if (T.pointers.size >= 2) {
    const [a, b] = ptrList();
    const d = Math.hypot(a.x - b.x, a.y - b.y) || 1;
    const k = T.pinchStartDist / d;      // 张开 → k<1 → 拉近
    const lo = S.mode === 'focus' ? FOC_DIST_MIN : GLOBE.distMin;
    const hi = S.mode === 'focus' ? FOC_DIST_MAX : GLOBE.distMax;
    S.dist = Math.max(lo, Math.min(hi, T.pinchStartScale * k));
    return;
  }

  if (!S.dragging) return;
  const dx = e.clientX - T.lastX;
  const dy = e.clientY - T.lastY;
  T.lastX = e.clientX; T.lastY = e.clientY;

  if (Math.hypot(e.clientX - T.downPos.x, e.clientY - T.downPos.y) > 6) { T.downOn = -1; T.moved = true; }

  if (S.mode === 'globe') {
    S.spin += dx * 0.006;
    S.spinVel = dx * 0.006;            // 供松手后的惯性
    S.el = Math.max(GLOBE.elMin, Math.min(GLOBE.elMax, S.el + dy * 0.004));
  } else if (S.mode === 'focus') {
    /* 以建筑为中心环绕：
         横向 → 方位角（绕法线转，建筑始终在画面中央）
         纵向 → 极角（往下拖 = 相机升高 = 更俯视）
       极角的夹取在 focusTargets 里做（那里才知道当前半径 r），
       拖过头不会再累积，松手反向立刻响应。 */
    S.fAz += dx * 0.008;
    S.fPol -= dy * 0.004;
  }
});

function endPointer(e) {
  const wasSingle = T.pointers.size === 1;
  T.pointers.delete(e.pointerId);

  if (T.pointers.size === 0) {
    // 只有「没拖动过」才算点击。
    // 之前只判断 downOn===-1，导致聚焦态下随便拖一下、松手就退回全景 —— 已修。
    if (wasSingle && !T.moved) {
      if (T.downOn >= 0) goFocus(T.downOn);          // 点中建筑 → 聚焦
      else if (S.mode === 'focus') goGlobe();        // 点空白 → 退出聚焦
    }
    S.dragging = false;
    T.downOn = -1; T.moved = false;
  } else {
    S.dragging = true;
    const [a] = ptrList();
    if (a) { T.lastX = a.x; T.lastY = a.y; }
  }
}
el.addEventListener('pointerup', endPointer);
/* 说明：拖动与点击的区分靠 T.moved（位移 >6px 置位）。
   聚焦态下拖动只是环绕，不会退出；只有真正的轻点空白才退回全景。 */
el.addEventListener('pointercancel', endPointer);

/* 滚轮缩放（桌面调试） */
el.addEventListener('wheel', e => {
  e.preventDefault();
  S.lastInput = performance.now();
  const lo = S.mode === 'focus' ? FOC_DIST_MIN : GLOBE.distMin;
  const hi = S.mode === 'focus' ? FOC_DIST_MAX : GLOBE.distMax;
  S.dist = Math.max(lo, Math.min(hi, S.dist * (1 + Math.sign(e.deltaY) * 0.08)));
}, { passive: false });

/* 自动化测试接口 */
window.__cam = {
  get mode() { return S.mode; },
  get focusIdx() { return S.focusIdx; },
  get dist() { return S.dist; },
  get el() { return S.el; },
  get spin() { return S.spin; },
  get fAz() { return S.fAz; },
  get fPol() { return S.fPol; },
  get th0() { return S.th0; },
  get camPos() { return { x: camPos.x, y: camPos.y, z: camPos.z }; },
  get camLook() { return { x: camLook.x, y: camLook.y, z: camLook.z }; },
  orbit: (az, pol) => { S.fAz = az; S.fPol = pol; },
  focus: i => goFocus(i),
  globe: () => goGlobe(),
  /* 冻结待机自转：导出截图时用，保证每次出图一致 */
  freeze: () => { S.lastInput = Infinity; S.spinVel = 0; },
  thaw: () => { S.lastInput = performance.now(); },
  setSpin: v => { S.spin = v; planet.rotation.y = v; },
  setDist: d => { S.dist = d; },
  facilityWorld: i => {
    const v = new THREE.Vector3().copy(facs[i].position);
    planet.localToWorld(v);
    return { x: v.x, y: v.y, z: v.z };
  },
  facilityScreen: i => {
    const v = new THREE.Vector3().copy(facs[i].position);
    planet.localToWorld(v);
    const r = el.getBoundingClientRect();
    const p = v.clone().project(camera);
    return { x: (p.x * .5 + .5) * r.width + r.left, y: (-p.y * .5 + .5) * r.height + r.top };
  },
};

requestAnimationFrame(tick);
</script>
