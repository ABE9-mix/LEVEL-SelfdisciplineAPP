<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>星港计划 · 顶部三维渲染实测 (spike)</title>
<style>
  :root{
    --bg:#0E1218; --surface:#161B23; --line:#232A35; --ink:#E9EDF3; --ink2:#9BA6B4;
    --accent:#E8A468; --ok:#5FBF8F; --bad:#C4614E;
  }
  *{box-sizing:border-box;-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:13px/1.5 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  .wrap{padding:12px;max-width:520px;margin:0 auto}
  h1{font-size:15px;margin:0 0 4px;font-weight:600}
  .sub{color:var(--ink2);font-size:11px;margin-bottom:12px}

  /* 与设计稿一致的视口：358×180 逻辑点 */
  .stage{position:relative;width:358px;max-width:100%;height:180px;
    border-radius:12px;overflow:hidden;border:1px solid var(--line);
    background:#060A12;touch-action:pan-y}
  .stage canvas{display:block;width:100%;height:100%}
  .stage.full{position:fixed;inset:0;width:100%;height:100%;border-radius:0;z-index:99;border:0}

  /* 占位静态图（真机验证「切换是否无感」） */
  .placeholder{position:absolute;inset:0;display:none;
    align-items:center;justify-content:center;color:var(--ink2);font-size:11px;
    background:radial-gradient(circle at 50% 55%,#1b2a44 0%,#0a1020 60%,#060A12 100%)}
  .placeholder.on{display:flex}

  .row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
  button{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);
    padding:8px 12px;border-radius:10px;font:inherit;font-size:12px}
  button:active{background:#1D232C}
  button.on{border-color:var(--accent);color:var(--accent)}
  button:disabled{opacity:.4}

  table{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}
  th,td{text-align:left;padding:5px 6px;border-bottom:1px solid var(--line)}
  th{color:var(--ink2);font-weight:500;width:44%}
  td{font-variant-numeric:tabular-nums}
  .ok{color:var(--ok)} .bad{color:var(--bad)} .warn{color:var(--accent)}
  pre{background:var(--surface);border:1px solid var(--line);border-radius:10px;
    padding:10px;overflow:auto;font-size:11px;color:var(--ink2);max-height:220px}
</style>
</head>
<body>
<div class="wrap">
  <h1>星港计划 · 顶部三维渲染实测</h1>
  <div class="sub">视口 358×180（与线框稿一致）· 用于 S0 可行性打表</div>

  <div class="stage" id="stage">
    <div class="placeholder" id="ph">静态占位图位置（首帧前 / 上下文丢失时显示）</div>
  </div>

  <div class="row">
    <button id="btnGL" class="on">WebGL2</button>
    <button id="btnGPU" disabled>WebGPU</button>
    <button id="btnFull">全屏对照</button>
    <button id="btnCap" class="on">30fps 上限</button>
    <button id="btnHold">显示占位图</button>
  </div>

  <table id="tbl">
    <tr><th>渲染后端</th><td id="v-backend">—</td></tr>
    <tr><th>首帧耗时</th><td id="v-first">—</td></tr>
    <tr><th>帧时间 p50</th><td id="v-p50">—</td></tr>
    <tr><th>帧时间 p95</th><td id="v-p95">—</td></tr>
    <tr><th>实际 FPS</th><td id="v-fps">—</td></tr>
    <tr><th>掉帧（>33ms）</th><td id="v-drop">—</td></tr>
    <tr><th>前 30s / 后 30s p95</th><td id="v-thermal">—</td></tr>
    <tr><th>DPR / 渲染倍率</th><td id="v-dpr">—</td></tr>
  </table>

  <table>
    <tr><th>navigator.gpu</th><td id="v-gpu">—</td></tr>
    <tr><th>GPU 适配器</th><td id="v-adapter">—</td></tr>
    <tr><th>WebGL2</th><td id="v-gl2">—</td></tr>
    <tr><th>WebGL renderer</th><td id="v-glr">—</td></tr>
    <tr><th>MAX_TEXTURE_SIZE</th><td id="v-maxtex">—</td></tr>
    <tr><th>deviceMemory</th><td id="v-mem">—</td></tr>
  </table>

  <pre id="log">等待初始化…</pre>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three/build/three.module.js",
    "three/webgpu": "https://unpkg.com/three/build/three.webgpu.js"
  }
}
</script>

<script type="module">
const $ = id => document.getElementById(id);
const logEl = $('log');
const log = (...a) => { logEl.textContent += '\n' + a.join(' '); console.log(...a); };

const RENDER_SCALE = 1.5;          // 渲染倍率封顶（设计建议 1.5–2.0）
const CAP_30 = true;               // 是否 30fps 上限

// ── 设备能力探测
(function probe(){
  $('v-dpr').textContent = `${devicePixelRatio} / 渲染×${RENDER_SCALE}`;
  $('v-mem').textContent = navigator.deviceMemory ? navigator.deviceMemory + ' GB' : '不支持';
  $('v-gpu').textContent = navigator.gpu ? '存在' : '不存在';
  if (navigator.gpu) $('v-gpu').className = 'ok';
  else { $('v-gpu').className = 'bad'; $('btnGPU').disabled = true; }

  const c = document.createElement('canvas');
  const gl = c.getContext('webgl2');
  $('v-gl2').textContent = gl ? '支持' : '不支持';
  $('v-gl2').className = gl ? 'ok' : 'bad';
  if (gl) {
    const dbg = gl.getExtension('WEBGL_debug_renderer_info');
    $('v-glr').textContent = dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER);
    $('v-maxtex').textContent = gl.getParameter(gl.MAX_TEXTURE_SIZE);
  }
  if (navigator.gpu) {
    navigator.gpu.requestAdapter().then(a => {
      $('v-adapter').textContent = a
        ? (a.info?.description || a.info?.vendor || 'ok（适配器可用）')
        : 'null（API 有但驱动不可用 → 必须降级）';
      $('v-adapter').className = a ? 'ok' : 'bad';
      // 只有适配器真的可用，才允许切 WebGPU
      $('btnGPU').disabled = !a;
    }).catch(e => { $('v-adapter').textContent = 'requestAdapter 失败: ' + e.message; });
  }
  log(`DPR ${devicePixelRatio} · 视口 358×180 → 物理 ${Math.round(358*Math.min(devicePixelRatio,RENDER_SCALE))}×${Math.round(180*Math.min(devicePixelRatio,RENDER_SCALE))}`);
})();

// ── three.js 动态加载（CDN 不可用时给出明确提示）
let THREE = null, WebGPURenderer = null;
try {
  THREE = await import('three');
  log('three 版本:', THREE.REVISION);
} catch (e) {
  log('❌ three.js 加载失败（需联网或改成本地副本）:', e.message);
  throw e;
}
try {
  ({ WebGPURenderer } = await import('three/webgpu'));
  log('WebGPU 渲染器模块: 可用');
} catch (e) {
  log('WebGPU 模块不可用:', e.message);
}

// ── 场景
const stage = $('stage');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, 358/180, 0.1, 100);
camera.position.set(0, 0.55, 3.35);
camera.lookAt(0, 0.1, 0);

// 星球：64×32 分段（按评估文档 §三）
const sphereGeo = new THREE.SphereGeometry(1, 64, 32);
const sphereMat = new THREE.MeshStandardMaterial({ color: 0x4A6FA5, roughness: 0.85, metalness: 0.05 });
const planet = new THREE.Mesh(sphereGeo, sphereMat);
scene.add(planet);

// 8 个设施（低模立方体，代表建筑体量）
const facMat = new THREE.MeshStandardMaterial({ color: 0xE8A468, roughness: 0.6, emissive: 0x3a2410, emissiveIntensity: 1 });
const facGeo = new THREE.BoxGeometry(0.09, 0.13, 0.09);
const facs = [];
for (let i = 0; i < 8; i++) {
  const m = new THREE.Mesh(facGeo, facMat);
  const lat = (i / 8) * Math.PI - Math.PI/2 + 0.25;
  const lon = i * 1.1;
  const r = 1.0;
  m.position.set(
    r * Math.cos(lat) * Math.cos(lon),
    r * Math.sin(lat),
    r * Math.cos(lat) * Math.sin(lon)
  );
  m.lookAt(0, 0, 0);
  m.position.multiplyScalar(1.06);
  facs.push(m); scene.add(m);
}

// 光照：模拟晨昏线（方向光 + 弱环境）
const dir = new THREE.DirectionalLight(0xfff0d6, 3.0);
dir.position.set(-2.2, 1.1, 1.6);
scene.add(dir);
scene.add(new THREE.AmbientLight(0x2a3550, 1.0));

// ── 渲染器
let renderer = null, backend = '—';

function makeSize() {
  return {
    w: stage.clientWidth || 358,
    h: stage.clientHeight || 180,
    dpr: Math.min(devicePixelRatio || 1, RENDER_SCALE, 2.0),
  };
}

async function initRenderer(kind) {
  if (renderer) { try { renderer.dispose?.(); } catch {} }
  stage.querySelectorAll('canvas').forEach(c => c.remove());

  const { w, h, dpr } = makeSize();
  if (kind === 'webgpu' && WebGPURenderer) {
    renderer = new WebGPURenderer({ antialias: false });
    await renderer.init();
    backend = 'WebGPU';
  } else {
    renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'low-power' });
    backend = 'WebGL2';
  }
  renderer.setPixelRatio(dpr);
  renderer.setSize(w, h, false);
  stage.appendChild(renderer.domElement);
  $('v-backend').textContent = backend + ` · ${Math.round(w*dpr)}×${Math.round(h*dpr)}`;

  // 上下文丢失监听（评估文档 §六 风险 3）
  renderer.domElement.addEventListener('webglcontextlost', e => {
    e.preventDefault();
    $('ph').classList.add('on');
    log('⚠️ webglcontextlost 触发 —— 真实 App 中此处应显示占位图并重建');
  });

  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.render(scene, camera);   // 预编译着色器
}

// ── 统计
const stats = {
  frames: 0, firstFrameAt: 0, times: [],
  windowStart: performance.now(), p95Early: null,
};
const t0 = performance.now();

function tick() {
  const now = performance.now();
  const dt = now - (stats.last || now);
  stats.last = now;

  if (stats.frames === 0) {
    stats.firstFrameAt = now;
    $('v-first').textContent = (now - t0).toFixed(0) + ' ms';
  }

  // 自转 + 设施呼吸
  planet.rotation.y += 0.0025;
  facs.forEach((m, i) => {
    m.rotation.y = planet.rotation.y + i * 0.1;
    m.scale.setScalar(1 + 0.06 * Math.sin(now * 0.002 + i));
  });

  renderer.render(scene, camera);

  stats.frames++;
  if (dt > 0 && dt < 500) stats.times.push(dt);
  if (stats.times.length > 4000) stats.times.shift();
  if (dt > 33) stats.drop = (stats.drop || 0) + 1;

  // 每 500ms 刷新一次统计
  if (now - stats.windowStart > 500) {
    stats.windowStart = now;
    refreshStats(now);
  }
}

function refreshStats(now) {
  const arr = stats.times.slice();
  if (!arr.length) return;
  arr.sort((a, b) => a - b);
  const p = q => arr[Math.min(arr.length - 1, Math.floor(arr.length * q))];
  const p50 = p(0.5), p95 = p(0.95);
  $('v-p50').textContent = p50.toFixed(2) + ' ms';
  $('v-p95').textContent = p95.toFixed(2) + ' ms';
  $('v-p95').className = p95 <= 16.8 ? 'ok' : p95 <= 33.4 ? 'warn' : 'bad';
  $('v-fps').textContent = (1000 / Math.max(p50, 0.01)).toFixed(0) + ' fps';
  $('v-drop').textContent = String(stats.drop || 0);

  // 温度/降频观察：第 30s 前后各取 p95
  const el = now - t0;
  if (!stats.p95Early && el > 30000) {
    stats.p95Early = p95;
    $('v-thermal').textContent = `${stats.p95Early.toFixed(1)} / 测量中…`;
  } else if (stats.p95Early && el > 60000) {
    const late = p95;
    const deg = ((late / stats.p95Early - 1) * 100).toFixed(0);
    $('v-thermal').textContent = `${stats.p95Early.toFixed(1)} / ${late.toFixed(1)} ms（${deg > 0 ? '+' : ''}${deg}%）`;
    $('v-thermal').className = Math.abs(deg) < 20 ? 'ok' : 'warn';
  }
}

let rafId = 0, lastDraw = 0;
let cap30 = CAP_30;          // 可变：可运行时解除 30fps 上限
function loop(ts) {
  rafId = requestAnimationFrame(loop);
  if (cap30 && (ts - lastDraw) < 33.3) return;
  lastDraw = ts;
  tick();
}

// ── 交互
$('btnGL').onclick = async () => {
  await initRenderer('webgl');
  $('btnGL').classList.add('on'); $('btnGPU').classList.remove('on');
};
$('btnGPU').onclick = async () => {
  try {
    await initRenderer('webgpu');
    $('btnGPU').classList.add('on'); $('btnGL').classList.remove('on');
    log('已切到 WebGPU');
  } catch (e) {
    log('❌ WebGPU 初始化失败:', e.message);
    await initRenderer('webgl');
  }
};
$('btnFull').onclick = () => {
  stage.classList.toggle('full');
  const { w, h, dpr } = makeSize();
  if (renderer) {
    renderer.setPixelRatio(dpr);
    renderer.setSize(w, h, false);
    camera.aspect = w / h; camera.updateProjectionMatrix();
  }
  log(`视口切换 → ${stage.classList.contains('full') ? '全屏' : '358×180'}`);
};
$('btnCap').onclick = () => {
  cap30 = !cap30;
  $('btnCap').classList.toggle('on', cap30);
  $('btnCap').textContent = cap30 ? '30fps 上限' : '不限帧率';
  // 切换后重置统计窗口，避免两次采样混在一起
  stats.times = []; stats.drop = 0; stats.windowStart = performance.now();
  log('帧率上限 → ' + (cap30 ? '30fps' : '不限（跟随屏幕刷新率）'));
};
$('btnHold').onclick = () => {
  $('ph').classList.toggle('on');
};

// ── 启动
await initRenderer('webgl');
loop(0);
log('采样中… 建议连续观察 90 秒（含 30s/60s 温度对比）');
</script>
</body>
</html>
